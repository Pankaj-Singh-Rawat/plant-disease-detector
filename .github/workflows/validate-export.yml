name: Validate Model Export

on:
  push:
    paths:
      - 'src/model.py'
      - 'src/export.py'
      - 'src/quantize.py'
      - '.github/workflows/validate-export.yml'
  pull_request:
    paths:
      - 'src/model.py'
      - 'src/export.py'
      - 'src/quantize.py'

jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Run export validation
        run: python3 .github/scripts/validate_export.py